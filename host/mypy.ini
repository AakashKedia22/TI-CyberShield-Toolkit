[mypy]
# Specify the Python version being checked
python_version = 3.10

# Disallow the use of untyped function definitions
disallow_untyped_defs = True

# Disallow the use of untyped calls
disallow_untyped_calls = True

# Disallow the use of untyped decorated functions
disallow_untyped_decorators = True

# Disallow the use of untyped assignments
disallow_untyped_globals = True

# Disallow the use of untyped class attributes
disallow_untyped_class_attrs = True

# Disallow the use of dynamic typing
disallow_any_unimported = True
disallow_any_expr = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_generics = True

# Enable strict optional checking
strict_optional = True

# Warn about unused 'ignore' comments
warn_unused_ignores = True

# Warn about unreachable code
warn_unreachable = True

# Warn about unused configurations
warn_unused_configs = True

# Show error codes in error messages
show_error_codes = True

# Enable incremental mode
incremental = True

# Cache directory for mypy
cache_dir = .mypy_cache

# Follow imports
follow_imports = normal

# Ignore missing imports
ignore_missing_imports = True